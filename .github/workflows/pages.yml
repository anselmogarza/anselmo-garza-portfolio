name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          node --check quality-lab/dist/app.js
          node --check quality-lab/dist/migration-sim.js
      - name: Check interactive demo
        run: node quality-lab/check-demo.cjs
      - name: Check migration simulation
        run: node quality-lab/check-migration.cjs
      - name: Generate CV
        run: node quality-lab/build-cv.cjs
      - name: Check site links and PDF
        run: node quality-lab/check-site.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: quality-lab/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
